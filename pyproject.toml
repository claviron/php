[project]

name = "claviron-php"
version = "0.2.0-alpha.24"
description = "Local maintenance and Composer release tooling for Claviron PHP"
requires-python = ">=3.15"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
]
test = [
    "pytest",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "httpx[http2]>=0.28.1",
]
bench = [
    "scipy>=1.17.1",
]

# Local tooling only; the runtime and its native PHP API are Rust.
[tool.uv]
package = false

# Export only committed SAPI sources; Cargo versions do not select Composer tags.
[tool.packagist]
state-directory = "target/composer"

[[tool.packagist.packages]]
name = "claviron/sapi"
remote = "git@github.com:claviron/sapi.git"
directory = "php"
license = "LICENSE-MIT"
include = ["composer.json", "README.md", "src", "fallback"]
