[package]
name = "claviron-php"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
include.workspace = true
autotests = false
description = "PHP execution for Claviron, with embedded and FastCGI backends"
keywords = ["php", "fastcgi", "embedding", "sapi"]
categories = ["web-programming::http-server", "asynchronous"]

[features]
default = []
embed = ["dep:claviron-php-core", "claviron-php-core/php_embed", "dep:claviron-php-embed", "dep:claviron-runtime"]
fcgi = ["dep:claviron-php-core", "claviron-php-core/php_fcgi", "dep:claviron-php-fcgi", "dep:claviron-runtime"]
backend = ["dep:claviron-pipeline", "dep:claviron-http", "dep:serde_yaml", "claviron-php-embed?/backend", "claviron-php-fcgi?/backend"]
metrics = ["claviron-php-embed?/metrics", "claviron-php-fcgi?/metrics"]
tasks = ["claviron-php-embed?/tasks", "claviron-php-fcgi?/tasks"]
auth = ["claviron-php-embed?/auth"]
cache = ["claviron-php-embed?/cache"]
log-pipeline = ["claviron-php-embed?/log-pipeline"]
sqlite = ["claviron-php-embed?/sqlite"]
mysql = ["claviron-php-embed?/mysql"]
postgres = ["claviron-php-embed?/postgres"]

[dependencies]
claviron-php-core = { workspace = true, optional = true }
claviron-php-embed = { version = "0.2.0-alpha.26.1", path = "crates/embed", optional = true }
claviron-php-fcgi = { version = "0.2.0-alpha.26.1", path = "crates/fcgi", optional = true }
claviron-pipeline = { workspace = true, optional = true }
claviron-http = { workspace = true, optional = true }
claviron-runtime = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["crates/core", "crates/embed", "crates/fcgi"]
resolver = "3"

[workspace.package]
version = "0.2.0-alpha.26.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/claviron/php"
homepage = "https://github.com/claviron/php"
authors = ["ilker Arabaci <iadev09@claviron.dev>"]
publish = true
include = ["/src/**/*.rs", "/build.rs", "/tests/**", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[workspace.dependencies]
arc-swap = "1.9"
async-trait = "0.1"
bytes = "1.11"
claviron-app = { version = "0.2.0-alpha.26.1" }
claviron-auth = { version = "0.2.0-alpha.26.1" }
claviron-cache = { version = "0.2.0-alpha.26.1" }
claviron-db = { version = "0.2.0-alpha.26.1", default-features = false }
claviron-helpers = { version = "0.2.0-alpha.26.1" }
claviron-http = { version = "0.2.0-alpha.26.1" }
claviron-logging = { version = "0.2.0-alpha.26.1" }
claviron-orbit = { version = "0.2.0-alpha.26.1" }
claviron-php-core = { version = "0.2.0-alpha.26.1", path = "crates/core" }
claviron-pipeline = { version = "0.2.0-alpha.26.1" }
claviron-runtime = { version = "0.2.0-alpha.26.1" }
claviron-tasks = { version = "0.2.0-alpha.26.1" }
congif = "0.0.1"
ext-php-rs = { version = "0.16", default-features = false }
fastcgi-client = "0.12"
fastrand = "2.4"
futures = "0.3"
futures-util = "0.3"
http = "1.4"
http-body = "1.0"
http-body-util = "0.1"
libc = "0.2"
regex = "1.12"
serde = "1"
serde_json = "1.0"
serde_yaml = "0.9"
sqlx = { version = "0.9", default-features = false }
thiserror = "2.0"
time = "0.3"
tokio = "1"
tokio-util = "0.7"
tracing = "0.1"
uuid = "1.26"

[profile.dev]
opt-level = 1
debug = 1

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
