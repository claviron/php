[package]
autotests = false
name = "claviron-php-core"
version = "0.2.4"
publish.workspace = true
edition.workspace= true
description = "Shared PHP route configuration and runtime contracts for Claviron execution backends"
license.workspace = true
repository.workspace = true
authors.workspace = true
include.workspace = true
keywords = ["php", "runtime", "fastcgi", "sapi"]
categories = ["web-programming::http-server", "config", "asynchronous"]

[features]
default = []
php_embed = []
php_fcgi = []

[dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-app.workspace = true
claviron-helpers.workspace = true
# A connection's TLS facts, for the server variables every runner maps alike.
claviron-http = { workspace = true, features = ["server"] }
claviron-runtime.workspace = true

# ── Serialization & parsing ─────────────────────────────────────────────
serde = { workspace = true, features = ["derive"] }

# ── HTTP core ───────────────────────────────────────────────────────────
http.workspace = true

# ── Logging / errors / diagnostics ──────────────────────────────────────
tracing.workspace = true

[dev-dependencies]
# ── Internal workspace crates ───────────────────────────────────────────
claviron-types.workspace = true

# ── Serialization & parsing ─────────────────────────────────────────────
serde_yaml.workspace = true
